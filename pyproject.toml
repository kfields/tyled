[project]
name = "tyled"
version = "0.2.0"
description = "Make Tiled tilesets and maps from TOML projects and text layouts"
authors = [
    { name = "Kurtis Fields", email = "kurtisfields@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["tiled", "tileset", "tilemap", "map", "gamedev", "pixel-art"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "click>=8.1.3,<9",
    "jinja2>=3.1.2,<4",
    "loguru>=0.7.3,<0.9",
    "numpy",
    "opencv-python-headless~=4.13.0",
    "pillow>=10.4",
    "rectpack>=0.2.2,<0.3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Documentation = "https://tyled.readthedocs.io/en/latest/"
Source = "https://github.com/kfields/tyled"

[project.scripts]
tyled = "tyled.command:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tyled"]

# hatch's default environment is the project's own .venv, on Python 3.12, with the test extra:
# `hatch shell` enters it, `hatch run test` runs the tests, and `.venv/bin/...` keeps working as before.
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
python = "3.12"
features = ["test"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
