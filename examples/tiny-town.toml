# Kenney's Tiny Town (CC0), used as it is: the tilemap image stays where it is and the .tsx refers
# to it. Run from this folder:  tyled bake tiny-town.toml
#
# Positions are [column, row] in the image, counted from 0 at the top left; id = row * 12 + column.
# Tiles are walkable unless said otherwise. A piece is a rectangle of tiles with an anchor, the
# [column, row] inside the piece of the tile a layout's character stands for (a door, say).

name = 'tiny-town'
type = 'grid'
source = 'kenney/tiny-town/Tilemap/tilemap.png'
tilewidth = 16
tileheight = 16
spacing = 1

[defaults]
walkable = true

# ---- Ground

[[tiles]]
at = [0, 0]
name = 'grass'

[[tiles]]
at = [1, 0]
name = 'grass_tufts'

[[tiles]]
at = [2, 0]
name = 'grass_flowers'

# A patch of dirt with grass around it: three rows of three.
[[tiles]]
at = [0, 1]
name = 'dirt_nw'

[[tiles]]
at = [1, 1]
name = 'dirt_n'

[[tiles]]
at = [2, 1]
name = 'dirt_ne'

[[tiles]]
at = [0, 2]
name = 'dirt_w'

[[tiles]]
at = [1, 2]
name = 'dirt'

[[tiles]]
at = [2, 2]
name = 'dirt_e'

[[tiles]]
at = [0, 3]
name = 'dirt_sw'

[[tiles]]
at = [1, 3]
name = 'dirt_s'

[[tiles]]
at = [2, 3]
name = 'dirt_se'

# ---- Roads

[[tiles]]
at = [5, 3]
name = 'road_dirt'

[[tiles]]
at = [6, 3]
name = 'road_dirt_worn'

[[tiles]]
at = [3, 3]
name = 'road_dirt_edge_w'

[[tiles]]
at = [4, 3]
name = 'road_dirt_edge_e'

[[tiles]]
at = [7, 3]
name = 'road_cobble'

# ---- Trees, bushes and the forest

[[tiles]]
at = [3, 0]
name = 'pine_autumn_top'
properties = { walkable = false, kind = 'tree' }

[[tiles]]
at = [4, 0]
name = 'pine_top'
properties = { walkable = false, kind = 'tree' }

[[tiles]]
at = [5, 0]
name = 'bush'
properties = { walkable = false, kind = 'bush' }

[[tiles]]
at = [3, 1]
name = 'pine_autumn_bottom'
properties = { walkable = false, kind = 'tree' }

[[tiles]]
at = [4, 1]
name = 'pine_bottom'
properties = { walkable = false, kind = 'tree' }

[[tiles]]
at = [5, 1]
name = 'sprout'

[[tiles]]
at = [3, 2]
name = 'pine_autumn'
properties = { walkable = false, kind = 'tree' }

[[tiles]]
at = [4, 2]
name = 'pine'
properties = { walkable = false, kind = 'tree' }

[[tiles]]
at = [5, 2]
name = 'mushrooms'

# The two forest blocks (green, autumn) are trees all the way: none of their tiles can be walked on.
[[tiles]]
region = [6, 0, 3, 3]
properties = { walkable = false, kind = 'tree' }

[[tiles]]
region = [9, 0, 3, 3]
properties = { walkable = false, kind = 'tree' }

# ---- Houses: roofs, walls, doors and windows. Walls and roofs can't be walked on; the doors can.

[[tiles]]
