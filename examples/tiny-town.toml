# Kenney's Tiny Town (CC0), used as it is: the tilemap image stays where it is and the .tsx refers
# to it. Run from this folder:  tyled bake tiny-town.toml
#
# Positions are [column, row] in the image, counted from 0 at the top left; id = row * 12 + column.
# Tiles are walkable unless said otherwise. A piece is a rectangle of tiles with an anchor, the
# [column, row] inside the piece of the tile a layout's character stands for (a door, say).

name = 'tiny-town'
type = 'grid'
source = 'kenney/tiny-town/Tilemap/tilemap.png'
tilewidth = 16
tileheight = 16
spacing = 1

[defaults]
walkable = true

# ---- Ground

[[tiles]]
at = [0, 0]
name = 'grass'

[[tiles]]
at = [1, 0]
name = 'grass_tufts'

[[tiles]]
at = [2, 0]
name = 'grass_flowers'

# A patch of dirt with grass around it: three rows of three.
[[tiles]]
at = [0, 1]
name = 'dirt_nw'

[[tiles]]
at = [1, 1]
name = 'dirt_n'

[[tiles]]
at = [2, 1]
name = 'dirt_ne'

[[tiles]]
at = [0, 2]
name = 'dirt_w'

[[tiles]]
at = [1, 2]
name = 'dirt'

[[tiles]]
at = [2, 2]
name = 'dirt_e'

[[tiles]]
at = [0, 3]
name = 'dirt_sw'

[[tiles]]
at = [1, 3]
name = 'dirt_s'

[[tiles]]
at = [2, 3]
name = 'dirt_se'

