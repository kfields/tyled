properties = { walkable = false, kind = 'beehive' }

[[tiles]]
at = [11, 7]
name = 'target'
properties = { walkable = false, kind = 'target' }

[[tiles]]
at = [9, 7]
name = 'coin'

[[tiles]]
at = [9, 8]
name = 'bomb'

[[tiles]]
at = [10, 8]
name = 'log'

[[tiles]]
at = [11, 8]
name = 'bag'

[[tiles]]
at = [7, 9]
name = 'pickaxe'

[[tiles]]
at = [8, 9]
name = 'pitchfork'

[[tiles]]
at = [9, 9]
name = 'key'

[[tiles]]
at = [10, 9]
name = 'bow'

[[tiles]]
