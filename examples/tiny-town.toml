# ---- Pieces

# Houses: two rows of roof over a row of wall, anchored on the door. Cells are names or, for tiles
# that have none, ids (id = row * 12 + column).
[[pieces]]
name = 'house_wood_grey'
rows = [[48, 49, 50], [60, 'gable_grey', 62], [72, 'door_wood', 75]]
anchor = [1, 2]

[[pieces]]
name = 'house_wood_grey_wide'
rows = [[48, 'chimney_grey', 49, 50], [60, 61, 'gable_grey', 62], [72, 'window_wood', 'door_wood', 75]]
anchor = [2, 2]

[[pieces]]
name = 'house_stone_red'
rows = [[52, 53, 54], [64, 'gable_red', 66], [76, 'door_stone', 79]]
anchor = [1, 2]

[[pieces]]
name = 'house_stone_red_wide'
rows = [[52, 'chimney_red', 53, 54], [64, 65, 'gable_red', 66], [76, 'window_stone', 'door_stone', 79]]
anchor = [2, 2]

[[pieces]]
name = 'forest_green'
region = [6, 0, 3, 3]
anchor = [1, 1]

[[pieces]]
name = 'forest_autumn'
region = [9, 0, 3, 3]
anchor = [1, 1]

# Nine-slices: corners, edges and a centre, which a map stretches to any size by repeating the edges
# and the centre. The anchor is the centre.
[[pieces]]
name = 'castle_courtyard'
kind = 'nine_slice'
region = [0, 8, 3, 3]

[[pieces]]
name = 'dirt_patch'
kind = 'nine_slice'
region = [0, 1, 3, 3]

[[pieces]]
name = 'castle_gate_house'
region = [3, 8, 2, 3]
anchor = [1, 2]

# The gate's passage alone, one tile high: it fits in the courtyard's wall, where a piece may stand on the
# edge of a nine-slice, and replaces the wall's tiles there. (The gate house above is for a wall of its own.)
[[pieces]]
name = 'castle_gateway'
rows = [['castle_gate_left', 'castle_gate_right']]
anchor = [0, 0]

# Rows of names, for what the image doesn't lay out in a rectangle.
[[pieces]]
name = 'well_roofed'
rows = [['well_roof'], ['well']]
anchor = [0, 1]

[[pieces]]
name = 'pine_tall'
rows = [['pine_top'], ['pine_bottom']]
anchor = [0, 1]

[[pieces]]
name = 'pine_autumn_tall'
rows = [['pine_autumn_top'], ['pine_autumn_bottom']]
anchor = [0, 1]
